name: windows-real-acceptance

permissions:
  contents: read

on:
  push:
    branches: ["acceptance/real-windows-*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type disposable-real-registry to mutate only this fresh runner's HKCU proxy state"
        required: true
        type: string

jobs:
  real-registry:
    if: (github.event_name == 'push' && startsWith(github.ref_name, 'acceptance/real-windows-')) || github.event.inputs.confirm == 'disposable-real-registry'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
      - name: build exact non-fixture candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '${{ github.sha }}'
          $source = Join-Path $env:RUNNER_TEMP 'otu-source'
          git clone -c core.autocrlf=false --no-checkout https://github.com/Gdaborro/Opentunnel.git $source
          if ($LASTEXITCODE -ne 0) { throw 'source clone failed' }
          git -C $source checkout --detach $commit
          if ($LASTEXITCODE -ne 0) { throw 'source checkout failed' }
          Set-Location $source
          $env:CGO_ENABLED = '0'
          $builder = Join-Path $env:RUNNER_TEMP 'otu-buildcandidate.exe'
          go build -buildvcs=false -trimpath -o $builder ./tools/buildcandidate
          if ($LASTEXITCODE -ne 0) { throw 'build tool compilation failed' }
          $tag = 'v' + (Select-String -Path internal/version/version.go -Pattern '^var Version = "([^"]+)"').Matches.Groups[1].Value
          $toolchain = (go version).Split(' ')[2]
          $output = Join-Path $env:RUNNER_TEMP 'otu-real-candidate'
          $goexe = Join-Path (go env GOROOT) 'bin\go.exe'
          & $builder --go-executable $goexe --source-directory $source --source-commit "$commit" --directory $output --tag "$tag" --toolchain "$toolchain"
          if ($LASTEXITCODE -ne 0) { throw 'fixed candidate build failed' }
      - name: real HKCU proxy and browser-policy acceptance
        shell: pwsh
        env:
          OTU_REAL_WINDOWS_ACCEPTANCE: disposable-runner
          OTU_REAL_WINDOWS_CLIENT: ${{ runner.temp }}/otu-real-candidate/otu-client-windows-amd64.exe
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:RUNNER_TEMP 'otu-source')
          go test -race -count=1 -v -timeout 180s -run '^TestRealWindows' ./test
          if ($LASTEXITCODE -ne 0) { throw 'real Windows registry acceptance failed' }
