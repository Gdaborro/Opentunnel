name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, "review/hardening-reality-*", "release/*", "fix/*", "feat/trusted-server-pools"]
  pull_request:

jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: companions/xray/go.mod
          cache-dependency-path: companions/xray/go.sum
      - run: go mod verify
        working-directory: companions/xray
      - run: go vet ./...
        working-directory: companions/xray
      - run: go test -race -timeout 180s ./...
        working-directory: companions/xray
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: companions/xray
      - name: build isolated REALITY test companion
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'otu-xray-lab'
          if ($IsWindows) { $target += '.exe' }
          Push-Location companions/xray
          try { go build -buildvcs=false -trimpath -o $target . } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Companion build failed' }
          "OTU_TEST_XRAY=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: authenticated REALITY confinement and supervision
        run: go test -race -count=3 -v -timeout 180s ./internal/reality

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"
      - name: vet
        run: go vet ./...
      - name: module integrity
        run: go mod verify
      - name: staged Windows production client version preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'otu-release-client.exe'
          go build -buildvcs=false -trimpath -ldflags="-s -w" -o $target ./cmd/otu-client
          if ($LASTEXITCODE -ne 0) { throw 'Client acceptance binary build failed' }
          "OTU_TEST_PRODUCTION_CLIENT_BINARY=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: fixture-only Windows automatic-proxy client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'otu-autoproxy-fixture.exe'
          go build -buildvcs=false -tags=netenvfixture -trimpath -ldflags="-s -w" -o $target ./cmd/otu-client
          if ($LASTEXITCODE -ne 0) { throw 'Automatic-proxy fixture build failed' }
          "OTU_TEST_AUTOPROXY_BINARY=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTU_TEST_CLIENT_BINARY=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTU_INTERNAL_REVIEW_FIXTURE=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTU_SECURITY_REVIEW_REPRO=1" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: fixture-only generic Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'otu-generic-fixture.exe'
          go build -buildvcs=false '-tags=genericclient,netenvfixture' -trimpath -ldflags="-s -w" -o $target ./cmd/otu-client
          if ($LASTEXITCODE -ne 0) { throw 'Generic edition fixture build failed' }
          "OTU_TEST_GENERIC_CLIENT_BINARY=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: generic-client configuration and edition tests
        shell: pwsh
        run: |
          $priorFixture = $env:OTU_INTERNAL_REVIEW_FIXTURE
          if ($IsWindows) { $env:OTU_INTERNAL_REVIEW_FIXTURE = $env:OTU_TEST_GENERIC_CLIENT_BINARY }
          try {
            go test -race '-tags=genericclient,netenvfixture' -count=1 -timeout 180s ./internal/config ./cmd/otu-client ./internal/client ./internal/protocol
            if ($LASTEXITCODE -ne 0) { throw 'Generic edition checks failed' }
          } finally { $env:OTU_INTERNAL_REVIEW_FIXTURE = $priorFixture }
      - name: editions cannot share credentials or bypass network ownership
        if: runner.os == 'Windows'
        run: go test -race -tags=netenvfixture -count=1 -v -run '^TestGenericEdition|^TestClientEditions|^TestFixtureStartupRefusal' -timeout 180s ./test
      - name: automatic-proxy startup and legacy policy migration acceptance
        if: runner.os == 'Windows'
        run: go test -race -count=1 -v -run '^TestFixtureClientAutomaticProxyStartupAndLegacyRecovery$' -timeout 180s ./test
      - name: registry-free trusted-pool executable acceptance
        if: runner.os == 'Windows'
        run: go test -race -tags=netenvfixture -count=1 -v -run '^TestFixtureClientTrustedPoolImportSelectionAndTraffic$|^TestFixtureClientChannelPoolImportSelectionAndTraffic$|^TestFixtureSOCKSOnlyAutoProxy' -timeout 180s ./test
      - name: staged native central authority and relay executables
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $server = Join-Path $env:RUNNER_TEMP ('otu-authority-relay-test' + $suffix)
          $panel = Join-Path $env:RUNNER_TEMP ('otu-authority-panel-test' + $suffix)
          go build -buildvcs=false -trimpath -o $server ./cmd/otu-server
          if ($LASTEXITCODE -ne 0) { throw 'Relay process fixture build failed' }
          go build -buildvcs=false -trimpath -o $panel ./cmd/otu-panel
          if ($LASTEXITCODE -ne 0) { throw 'Authority process fixture build failed' }
          "OTU_TEST_SERVER_BINARY=$server" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTU_TEST_PANEL_BINARY=$panel" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: central authority with two real node processes
        run: go test -race -tags=netenvfixture -count=1 -v -run '^TestCentralAuthorityNativeExecutables' -timeout 180s ./test
      - name: gofmt check
        run: |
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then echo "unformatted: $OUT"; exit 1; fi
        if: runner.os == 'Linux'
      - name: tests (race, includes test/security regression suite)
        run: go test -race -tags=netenvfixture -count=1 -timeout 300s ./...
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        if: runner.os == 'Linux'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
        working-directory: panel-ui
      - run: npm audit --audit-level=low
        working-directory: panel-ui
      - run: pwsh -File scripts/build-panel.ps1 -SkipInstall -NoBackup
      - name: embedded SPA matches source build
        run: |
          git diff --exit-code -- internal/panel/ui/dist
          test -z "$(git ls-files --others --exclude-standard internal/panel/ui/dist)"

  build:
    needs: [test, frontend, companion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # preserve exact VCS module/tag identity for recipe checks
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"
      - name: fixed clean-source recipe (unsigned CI artifacts, not release promotion)
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/otu-buildcandidate" ./tools/buildcandidate
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/otu-releasebundle" ./tools/releasebundle
          COMMIT="$(git rev-parse HEAD)"
          TAG="$(sed -n 's/^var Version = "\([^"]*\)"/v\1/p' internal/version/version.go)"
          TOOLCHAIN="$(go version | awk '{print $3}')"
          "$RUNNER_TEMP/otu-buildcandidate" --go-executable "$(go env GOROOT)/bin/go" --source-directory "$GITHUB_WORKSPACE" --source-commit "$COMMIT" --directory "$RUNNER_TEMP/otu-candidate-dist" --tag "$TAG" --toolchain "$TOOLCHAIN"
          "$RUNNER_TEMP/otu-releasebundle" --prepare-metadata --source-directory "$GITHUB_WORKSPACE" --source-commit "$COMMIT" --directory "$RUNNER_TEMP/otu-candidate-dist" --tag "$TAG" --toolchain "$TOOLCHAIN" --sequence 1 --minimum-version v1.1.10 --rollout 0
          "$RUNNER_TEMP/otu-releasebundle" --source-directory "$GITHUB_WORKSPACE" --source-commit "$COMMIT" --directory "$RUNNER_TEMP/otu-candidate-dist" --tag "$TAG" --toolchain "$TOOLCHAIN" --sequence 1 --minimum-version v1.1.10 --rollout 0
      - name: companion artifact vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/otu-candidate-dist/otu-xray-linux-amd64"
      - name: host artifact vulnerability gate
        run: |
          for asset in "$RUNNER_TEMP/otu-candidate-dist"/otu-client-windows-amd64.exe "$RUNNER_TEMP/otu-candidate-dist"/otu-client-generic-windows-amd64.exe "$RUNNER_TEMP/otu-candidate-dist"/otu-server-linux-amd64 "$RUNNER_TEMP/otu-candidate-dist"/otu-panel-linux-amd64; do
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$asset"
          done
      - name: isolated native release executable smoke
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/otu-rollout-smoke" ./tools/rolloutsmoke
          "$RUNNER_TEMP/otu-rollout-smoke" -binary-dir "$RUNNER_TEMP/otu-candidate-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opentunnel-unsigned-ci-consistency-artifacts
          path: ${{ runner.temp }}/otu-candidate-dist/
