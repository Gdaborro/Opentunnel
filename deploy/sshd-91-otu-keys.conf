# opentunnel ssh tier: serve panel-approved device keys.
#
# The panel runs as user 'otu' and cannot write /home/tun/.ssh, so approved
# keys land in /var/lib/opentunnel/authorized_keys and this command (running
# as root) serves both files to sshd. Install as
# /etc/ssh/sshd_config.d/91-otu-keys.conf plus /usr/local/sbin/otu-keys.sh,
# then: sshd -t && systemctl reload ssh
Match User tun
    AuthorizedKeysCommand /usr/local/sbin/otu-keys.sh
    AuthorizedKeysCommandUser root
